# Port 80 locations for the CRL: included by nginx-client-crl-server.conf (compose.example.yml), or included in the
# port 80 server block of your own nginx (compose.override.example.yml); nginx must share a network with step-ca-client.
# Variable + Docker resolver: nginx still starts (and serves the other paths) when step-ca-client is down or gets a
# new container IP; only /client/crl answers 502 then. Keep everything else on :80 at 404.
resolver 127.0.0.11 valid=30s ipv6=off;
location = /client/crl {
  limit_except GET HEAD { deny all; }
  set $client_ca step-ca-client;
  proxy_pass https://$client_ca:9000/1.0/crl;
  proxy_ssl_verify off;
}
location / { return 404; }
