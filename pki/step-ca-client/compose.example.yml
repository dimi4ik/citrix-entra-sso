# Standalone client CA project: step-ca-client + nginx for the public CRL, own network. Save as compose.yml in the
# project folder (docs/client-ca.md). No DOCKER_STEPCA_INIT_* variables: the image's auto-init prints the generated
# provisioner password into `docker logs`.
name: pki-client
services:
  step-ca-client:
    image: smallstep/step-ca:0.30.2
    container_name: step-ca-client
    restart: unless-stopped
    volumes:
      - ./step-client:/home/step
    ports:
      # enrollment workstations only: LAN IP, no internet port forward
      - "192.0.2.186:9444:9000"
    networks: [pki-client]
  nginx:
    # no depends_on: nginx starts without the CA (variable + resolver in the snippet), /client/crl answers 502 then
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    ports:
      # target of the internet port forward for the CRL
      - "80:80"
    volumes:
      - ./nginx-client-crl-server.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-client-crl.conf:/etc/nginx/snippets/client-crl.conf:ro
    networks: [pki-client]
networks:
  pki-client: {}
