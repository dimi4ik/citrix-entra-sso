# Complete port 80 server for the public CRL. compose.example.yml mounts this file as /etc/nginx/conf.d/default.conf,
# which replaces the image's default server, and mounts nginx-client-crl.conf as /etc/nginx/snippets/client-crl.conf.
server {
  listen 80 default_server;
  server_name _;
  server_tokens off;
  include /etc/nginx/snippets/client-crl.conf;
}
