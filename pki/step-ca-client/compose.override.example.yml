# Variant for your own compose project that already runs nginx on port 80: put this file next to its compose.yml,
# keep nginx and step-ca-client on the same network and include nginx-client-crl.conf in the port 80 server block.
# Without such a project use compose.example.yml. No DOCKER_STEPCA_INIT_* variables: the image's auto-init prints the
# generated provisioner password into `docker logs` (docs/client-ca.md).
services:
  step-ca-client:
    image: smallstep/step-ca:0.30.2
    container_name: step-ca-client
    restart: unless-stopped
    volumes:
      - ./step-client:/home/step
    ports:
      # enrollment workstations only: LAN IP, no internet port forward
      - "192.0.2.186:9444:9000"
